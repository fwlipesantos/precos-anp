services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-anp
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: admin
      APP_USER: anp
      APP_USER_PASSWORD: anp
    volumes:
      - oracle-dados:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  oracle-dados:
